<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexLead Prospector</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      background: #6366f1;
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { background: #4f46e5; }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <h3 style="margin: 0; font-size: 15px;">ApexLead Prospector</h3>
    <span class="badge">Live</span>
  </div>

  <button id="extractBtn" class="btn">1-Click Capture Prospect</button>

  <div id="resultCard" class="card" style="display: none;">
    <div id="contactName" style="font-weight: bold; font-size: 14px;"></div>
    <div id="contactDetails" style="color: #a1a1aa; margin-top: 4px;"></div>
    <div id="enrichmentStatus" style="margin-top: 8px;"></div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
