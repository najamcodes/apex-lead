version: '3.8'

services:
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=leadhunter
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "4000:4000"
    environment:
      - DB_TYPE=postgres
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/leadhunter
      - JWT_SECRET=production_secret_change_me
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_ADAPTER=web
      - NEXT_PUBLIC_API_URL=http://localhost:4000 # For local access
    depends_on:
      - server
    restart: unless-stopped

volumes:
  leadhunter_data:
  pgdata:
